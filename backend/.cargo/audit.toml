# Konfiguration für `cargo audit` (cargo-audit liest diese Datei automatisch).
#
# Jede Ausnahme braucht eine Begründung und einen Auslöser zur Neubewertung.
# Neue Meldungen sollen auffallen, deshalb hier nichts pauschal ausschließen.

[advisories]
ignore = [
  # rsa 0.9.x, Marvin-Angriff (Schlüsselrückgewinnung per Timing-Seitenkanal).
  # Kommt über webauthn-rs-core. Der Angriff betrifft private RSA-Schlüssel, der
  # Server prüft aber nur öffentliche Signaturen und hält keinen geheimen Schlüssel.
  # Es gibt keine korrigierte Version.
  # Neu bewerten: bei jeder neuen webauthn-rs-Version, spätestens bei stabiler 0.6.
  "RUSTSEC-2023-0071",

  # crypto-bigint 0.5.x, Timing-Probleme bei Operationen, die konstante Zeit haben sollen.
  # Kommt über elliptic-curve/p256 aus webauthn-rs. Der Server prüft nur öffentliche
  # Signaturen und rechnet nie mit geheimen Schlüsseln. Ein Fix liegt nur in einer neuen
  # Hauptversion von elliptic-curve, also bei webauthn-rs.
  # Neu bewerten: bei jeder neuen webauthn-rs-Version, spätestens bei stabiler 0.6.
  "RUSTSEC-2026-0387",

  # libsqlite3-sys 0.37.0 (gebündeltes SQLite vor 3.54.0), CVE-2026-119375: Informations-
  # preisgabe (nicht initialisierter Seiten-Cache), wenn SQLite eine präparierte WAL-Datei
  # mit zu kleiner Seitengröße verarbeitet. Voraussetzung ist eine vom Angreifer gelieferte
  # Datenbank- bzw. WAL-Datei. Die App öffnet nur ihre eigene Datei im Volume `/data`, nie
  # eine hochgeladene oder importierte (der Import liest JSON, keine SQLite-Dateien).
  # Ein Update ist derzeit nicht möglich: sqlx-sqlite 0.9.0 (neueste sqlx-Version) erlaubt
  # nur libsqlite3-sys >=0.30.1, <0.38.0, behoben ist es erst ab 0.39.0.
  # Neu bewerten: bei jeder neuen sqlx-Version (Dependabot), dann Ausnahme entfernen.
  "RUSTSEC-2026-0459",
]
