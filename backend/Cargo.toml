[package]
name = "readlater-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.1"
argon2 = "0.6"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
dom_smoothie = "0.18.2"
encoding_rs = "0.8.42"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4"
governor = { version = "0.10.4", default-features = false, features = ["std", "dashmap", "quanta"] }
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
mime_guess = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "charset", "gzip", "brotli"] }
rust-embed = "8"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
time = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
whatlang = "0.18.0"

[dev-dependencies]
flate2 = "1.1.10"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# Argon2 ist im Debug-Build sehr langsam, daher nur diese Pakete auch in Tests optimieren.
# (Alle Abhängigkeiten zu optimieren würde den Build mit den vielen Crates stark verlangsamen.)
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
strip = true
# Kein LTO: Das Linken mit LTO dominierte den Build des eigenen Codes im Docker-Image
# (gemessen 68 s gegen 18 s bei gleich großem Binary). Siehe CLAUDE.md.

# Bildverarbeitung ist im Debug-Build ohne Optimierung sehr langsam (Tests, lokales Arbeiten).
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
