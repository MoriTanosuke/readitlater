name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # checks: write braucht dorny/test-reporter, um das Ergebnis als Check-Run anzuzeigen.
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # cargo-nextest schreibt den JUnit-Bericht (backend/.config/nextest.toml, Profil ci).
      # Lokal reicht weiterhin `cargo test`.
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --profile ci --locked

      # Frontend-Tests: echtes Frontend in jsdom gegen das gebaute Backend.
      # Node und npm werden nur dafür gebraucht und gelangen nicht in die Images.
      - run: cargo build --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/tests/package-lock.json
      - name: Frontend-Tests
        working-directory: frontend/tests
        run: |
          npm ci
          npm run test:ci

      # Auswertung der JUnit-Berichte (laufen auch nach fehlgeschlagenen Tests).
      # Bei Pull Requests aus Forks fehlt dem Token die Berechtigung checks: write.
      - name: Backend-Testbericht
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Backend-Tests
          path: backend/target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Frontend-Testbericht
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Frontend-Tests
          path: frontend/tests/junit.xml
          reporter: java-junit
          fail-on-error: false

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Image-Namen müssen kleingeschrieben sein.
      - name: Image-Namen bestimmen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Nur beim Push auf main anmelden und veröffentlichen; in Pull Requests wird nur gebaut.
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Für einen ARM-Server (z. B. Raspberry Pi) zusätzlich linux/arm64 eintragen.
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
