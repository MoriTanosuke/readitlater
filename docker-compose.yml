# Compose-Datei für den Server. Das Image baut GitHub Actions nach ghcr.io,
# Watchtower holt neue Versionen automatisch.
# Einmalig: .env aus .env.example anlegen (GITHUB_REPO setzen), dann `docker compose up -d`.
name: readitlater

services:
  app:
    image: ghcr.io/${GITHUB_REPO:-owner/repo}:latest
    restart: unless-stopped
    # Kein veröffentlichter Port: Das Backend darf nur über den Reverse-Proxy (Caddy)
    # erreichbar sein, weil die Ratenbegrenzung dem letzten X-Forwarded-For-Eintrag vertraut.
    environment:
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-true}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - app-data:/data # hier liegt die SQLite-Datei
    networks:
      - proxy
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true" # nur Container mit dem Label oben aktualisieren
      WATCHTOWER_POLL_INTERVAL: "300" # alle 5 Minuten prüfen
      WATCHTOWER_CLEANUP: "true" # alte Images entfernen
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Nur nötig, wenn die Images in ghcr.io privat sind: vorher auf dem Server
      # `docker login ghcr.io` ausführen (Token mit read:packages) und die Zeile aktivieren.
      # - /root/.docker/config.json:/config.json:ro

networks:
  # Gemeinsames Netz mit dem vorhandenen Caddy-Container (Name in .env: PROXY_NETWORK).
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true

volumes:
  app-data:
